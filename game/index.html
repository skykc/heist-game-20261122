<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VAULTBREAK — Midnight at the Meridian Museum</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d14; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="VAULTBREAK: a top-down stealth heist. Move with WASD, throw coins with the mouse, dodge guard vision cones and cameras, lift the loot and reach the exit before the alarm hits 100 percent"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
